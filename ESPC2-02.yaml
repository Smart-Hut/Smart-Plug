substitutions:
  voltage_divider: "1446.0976136351096"
  current_resistor: "0.0006145187444662681"
  current_multiply: "1.0"

globals:
  - id: relay_restore_mode
    type: int
    restore_value: yes
    initial_value: '0'
  - id: relay_last_state
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: auto_off_enabled_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: led_mode
    type: int
    restore_value: yes
    initial_value: '0'
  - id: local_button_lock_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: standby_killer_enabled_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: appliance_detection_enabled_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: appliance_has_run
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: appliance_finished_state
    type: bool
    restore_value: no
    initial_value: 'false'

esphome:
  name: smarthutplug
  friendly_name: Smart Hut Plug
  name_add_mac_suffix: true
  project:
    name: smarthut.esp32c3_plug
    version: "2.1.0"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - delay: !lambda |-
        return (uint32_t) (id(power_restore_delay).state * 1000);
    - lambda: |-
        if(id(relay_restore_mode) == 0){
          id(relay).turn_off();
        } else if(id(relay_restore_mode) == 1){
          id(relay).turn_on();
        } else if(id(relay_restore_mode) == 2){
          if(id(relay_last_state)) {
            id(relay).turn_on();
          } else {
            id(relay).turn_off();
          }
        }
    - select.set_index:
        id: power_loss_select
        index: !lambda |-
          return id(relay_restore_mode);
    - select.set_index:
        id: led_behavior_select
        index: !lambda |-
          return id(led_mode);
    - script.execute: update_led
  

dashboard_import:
  package_import_url: github://Smart-Hut/Smart-Plug/ESPC2-02.yaml@v2.1.0
  import_full_config: false # or true

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

#Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Smart hut Plug"

esp32_improv:
  authorizer: none

bluetooth_proxy:
  active: true

captive_portal:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO5
      inverted: true
    cf_pin: GPIO7
    cf1_pin: GPIO3
    voltage_divider: ${voltage_divider}
    current_resistor: ${current_resistor}
    current:
      name: "Current"
      id: current_sensor
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      accuracy_decimals: 3
      filters:
        - multiply: ${current_multiply}
        - lambda: |-
            return x * id(current_calibration_multiplier).state;
    voltage:
      name: "Voltage"
      id: voltage_sensor
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return x * id(voltage_calibration_multiplier).state;
    power:
      name: "Power"
      id: power_sensor
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return x * id(power_calibration_multiplier).state;
    energy:
      name: "Energy"
      id: energy_sensor
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: Wh
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return x * id(power_calibration_multiplier).state;
    update_interval: 15s

  - platform: total_daily_energy
    name: "Daily Energy"
    id: daily_energy_sensor
    power_id: power_sensor
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: integration
    name: "Lifetime Energy"
    id: lifetime_energy_sensor
    sensor: power_sensor
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: template
    name: "Today Cost"
    id: today_cost_sensor
    lambda: |-
      if (!id(daily_energy_sensor).has_state()) {
        return NAN;
      }
      return id(daily_energy_sensor).state * id(electricity_rate).state;
    unit_of_measurement: GBP
    device_class: monetary
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s

  - platform: template
    name: "Lifetime Cost"
    id: lifetime_cost_sensor
    lambda: |-
      if (!id(lifetime_energy_sensor).has_state()) {
        return NAN;
      }
      return id(lifetime_energy_sensor).state * id(electricity_rate).state;
    unit_of_measurement: GBP
    device_class: monetary
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO20
      inverted: true
    name: button
    id: power_button
    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at most 500ms
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                lambda: |-
                  return !id(local_button_lock_state);
              then:
                - select.operation:
                    id: power_loss_select
                    operation: NEXT
                    cycle: true
      - timing:
          - ON for at most 750ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                lambda: |-
                  return !id(local_button_lock_state);
              then:
                - switch.toggle: relay
      - timing:
          - ON for 1s to 5s
          - OFF for at least 50ms
        then:
          - if:
              condition:
                lambda: |-
                  return !id(local_button_lock_state);
              then:
                - select.operation:
                    id: led_behavior_select
                    operation: NEXT
                    cycle: true

  - platform: template
    name: "Load Detected"
    id: load_detected
    lambda: |-
      return id(power_sensor).has_state() && id(power_sensor).state >= id(load_detected_threshold).state;
    device_class: power

  - platform: template
    name: "Standby Detected"
    id: standby_detected
    lambda: |-
      return id(relay).state && id(power_sensor).has_state()
        && id(power_sensor).state > 0.1
        && id(power_sensor).state <= id(standby_threshold).state;
    device_class: power

  - platform: template
    name: "High Power"
    id: high_power_detected
    lambda: |-
      return id(power_sensor).has_state() && id(power_sensor).state >= id(high_power_threshold).state;
    device_class: power

  - platform: template
    name: "Appliance Running"
    id: appliance_running
    lambda: |-
      return id(appliance_detection_enabled_state) && id(appliance_has_run) && !id(appliance_finished_state);
    device_class: running

  - platform: template
    name: "Appliance Finished"
    id: appliance_finished
    lambda: |-
      return id(appliance_detection_enabled_state) && id(appliance_finished_state);
    device_class: running

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic

light:
  - platform: status_led
    id: wifi_light
    internal: true
    name: "Switch state"
    pin: 
      number: GPIO6
      inverted: true
  - platform: binary
    id: led
    name: "LED 2"
    output: gpio_led

output:
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
    id: gpio_led

switch:
  - platform: gpio
    pin: GPIO4
    name: "plug"
    id: relay
    on_turn_on:
      then:
      - globals.set:
          id: relay_last_state
          value: 'true'
      - script.execute: update_led
      - if:
          condition:
            lambda: |-
              return id(auto_off_enabled_state);
          then:
            - script.execute: auto_off_timer
    on_turn_off:
      then:
      - globals.set:
          id: relay_last_state
          value: 'false'
      - globals.set:
          id: appliance_has_run
          value: 'false'
      - globals.set:
          id: appliance_finished_state
          value: 'false'
      - script.stop: auto_off_timer
      - script.stop: standby_killer_timer
      - script.stop: appliance_finished_timer
      - script.execute: update_led

  - platform: template
    name: "Auto Off Enabled"
    id: auto_off_enabled
    lambda: |-
      return id(auto_off_enabled_state);
    turn_on_action:
      - globals.set:
          id: auto_off_enabled_state
          value: 'true'
      - if:
          condition:
            switch.is_on: relay
          then:
            - script.execute: auto_off_timer
    turn_off_action:
      - globals.set:
          id: auto_off_enabled_state
          value: 'false'
      - script.stop: auto_off_timer

  - platform: template
    name: "Local Button Lock"
    id: local_button_lock
    lambda: |-
      return id(local_button_lock_state);
    turn_on_action:
      - globals.set:
          id: local_button_lock_state
          value: 'true'
    turn_off_action:
      - globals.set:
          id: local_button_lock_state
          value: 'false'

  - platform: template
    name: "Standby Killer Enabled"
    id: standby_killer_enabled
    lambda: |-
      return id(standby_killer_enabled_state);
    turn_on_action:
      - globals.set:
          id: standby_killer_enabled_state
          value: 'true'
    turn_off_action:
      - globals.set:
          id: standby_killer_enabled_state
          value: 'false'
      - script.stop: standby_killer_timer

  - platform: template
    name: "Appliance Detection Enabled"
    id: appliance_detection_enabled
    lambda: |-
      return id(appliance_detection_enabled_state);
    turn_on_action:
      - globals.set:
          id: appliance_detection_enabled_state
          value: 'true'
      - globals.set:
          id: appliance_has_run
          value: 'false'
      - globals.set:
          id: appliance_finished_state
          value: 'false'
      - script.stop: appliance_finished_timer
    turn_off_action:
      - globals.set:
          id: appliance_detection_enabled_state
          value: 'false'
      - globals.set:
          id: appliance_has_run
          value: 'false'
      - globals.set:
          id: appliance_finished_state
          value: 'false'
      - script.stop: appliance_finished_timer

number:
  - platform: template
    name: "Power Restore Delay"
    id: power_restore_delay
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 300
    step: 1
    unit_of_measurement: s
    mode: box

  - platform: template
    name: "Auto Off Minutes"
    id: auto_off_minutes
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box

  - platform: template
    name: "Standby Killer Delay"
    id: standby_killer_delay
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 1440
    step: 1
    unit_of_measurement: min
    mode: box

  - platform: template
    name: "Load Detected Threshold"
    id: load_detected_threshold
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0.1
    max_value: 500
    step: 0.1
    unit_of_measurement: W
    mode: box

  - platform: template
    name: "Appliance Running Threshold"
    id: appliance_running_threshold
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 1
    max_value: 1000
    step: 1
    unit_of_measurement: W
    mode: box

  - platform: template
    name: "Appliance Finished Threshold"
    id: appliance_finished_threshold
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0.1
    max_value: 500
    step: 0.1
    unit_of_measurement: W
    mode: box

  - platform: template
    name: "Appliance Finished Delay"
    id: appliance_finished_delay
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 1
    max_value: 120
    step: 1
    unit_of_measurement: min
    mode: box

  - platform: template
    name: "Electricity Rate"
    id: electricity_rate
    optimistic: true
    restore_value: true
    initial_value: 0.30
    min_value: 0
    max_value: 2
    step: 0.01
    unit_of_measurement: GBP/kWh
    mode: box

  - platform: template
    name: "Standby Threshold"
    id: standby_threshold
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 0.1
    max_value: 100
    step: 0.1
    unit_of_measurement: W
    mode: box

  - platform: template
    name: "High Power Threshold"
    id: high_power_threshold
    optimistic: true
    restore_value: true
    initial_value: 2000
    min_value: 1
    max_value: 4000
    step: 1
    unit_of_measurement: W
    mode: box

  - platform: template
    name: "Voltage Calibration Multiplier"
    id: voltage_calibration_multiplier
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0.5
    max_value: 1.5
    step: 0.001
    mode: box
    entity_category: config

  - platform: template
    name: "Current Calibration Multiplier"
    id: current_calibration_multiplier
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0.5
    max_value: 1.5
    step: 0.001
    mode: box
    entity_category: config

  - platform: template
    name: "Power Calibration Multiplier"
    id: power_calibration_multiplier
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0.5
    max_value: 1.5
    step: 0.001
    mode: box
    entity_category: config

select:
  - platform: template
    name: "Power loss behaviour"
    id: power_loss_select
    options:
      - "OFF"
      - "ON"
      - "Restore last state"
    set_action:
      - lambda: |-
          if (x == "OFF") {
            id(relay_restore_mode) = 0;
          } else if (x == "ON") {
            id(relay_restore_mode) = 1;
          } else if (x == "Restore last state") {
            id(relay_restore_mode) = 2;
          }
          id(power_loss_select).publish_state(x);
    lambda: |-
      if (id(relay_restore_mode) == 0) {
        return {"OFF"};
      } else if (id(relay_restore_mode) == 1) {
        return {"ON"};
      } else if (id(relay_restore_mode) == 2) {
        return {"Restore last state"};
      }
      return {"OFF"};

  - platform: template
    name: "LED Behaviour"
    id: led_behavior_select
    options:
      - "Relay state"
      - "Always off"
      - "Always on"
    set_action:
      - lambda: |-
          if (x == "Relay state") {
            id(led_mode) = 0;
          } else if (x == "Always off") {
            id(led_mode) = 1;
          } else if (x == "Always on") {
            id(led_mode) = 2;
          }
          id(led_behavior_select).publish_state(x);
      - script.execute: update_led
    lambda: |-
      if (id(led_mode) == 0) {
        return {"Relay state"};
      } else if (id(led_mode) == 1) {
        return {"Always off"};
      } else if (id(led_mode) == 2) {
        return {"Always on"};
      }
      return {"Relay state"};

script:
  - id: auto_off_timer
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) (id(auto_off_minutes).state * 60000);
      - if:
          condition:
            and:
              - switch.is_on: relay
              - lambda: |-
                  return id(auto_off_enabled_state);
          then:
            - switch.turn_off: relay

  - id: standby_killer_timer
    mode: single
    then:
      - delay: !lambda |-
          return (uint32_t) (id(standby_killer_delay).state * 60000);
      - if:
          condition:
            and:
              - switch.is_on: relay
              - lambda: |-
                  return id(standby_killer_enabled_state)
                    && id(power_sensor).has_state()
                    && id(power_sensor).state > 0.1
                    && id(power_sensor).state <= id(standby_threshold).state;
          then:
            - switch.turn_off: relay

  - id: appliance_finished_timer
    mode: single
    then:
      - delay: !lambda |-
          return (uint32_t) (id(appliance_finished_delay).state * 60000);
      - if:
          condition:
            lambda: |-
              return id(appliance_detection_enabled_state)
                && id(appliance_has_run)
                && id(power_sensor).has_state()
                && id(power_sensor).state <= id(appliance_finished_threshold).state;
          then:
            - globals.set:
                id: appliance_finished_state
                value: 'true'

  - id: update_led
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(led_mode) == 0;
          then:
            - if:
                condition:
                  switch.is_on: relay
                then:
                  - light.turn_on: wifi_light
                else:
                  - light.turn_off: wifi_light
      - if:
          condition:
            lambda: |-
              return id(led_mode) == 1;
          then:
            - light.turn_off: wifi_light
      - if:
          condition:
            lambda: |-
              return id(led_mode) == 2;
          then:
            - light.turn_on: wifi_light

interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return id(standby_killer_enabled_state)
                && id(relay).state
                && id(power_sensor).has_state()
                && id(power_sensor).state > 0.1
                && id(power_sensor).state <= id(standby_threshold).state;
          then:
            - script.execute: standby_killer_timer
          else:
            - script.stop: standby_killer_timer
      - if:
          condition:
            lambda: |-
              return id(appliance_detection_enabled_state)
                && id(relay).state
                && id(power_sensor).has_state()
                && id(power_sensor).state >= id(appliance_running_threshold).state;
          then:
            - globals.set:
                id: appliance_has_run
                value: 'true'
            - globals.set:
                id: appliance_finished_state
                value: 'false'
            - script.stop: appliance_finished_timer
          else:
            - if:
                condition:
                  lambda: |-
                    return id(appliance_detection_enabled_state)
                      && id(relay).state
                      && id(appliance_has_run)
                      && !id(appliance_finished_state)
                      && id(power_sensor).has_state()
                      && id(power_sensor).state <= id(appliance_finished_threshold).state;
                then:
                  - script.execute: appliance_finished_timer
                else:
                  - script.stop: appliance_finished_timer


button:
  - platform: restart
    name: Restart
  - platform: factory_reset
    name: Restart with Factory Default Settings
